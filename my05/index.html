<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#241c2e">
<title>El vinilo roto</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#241c2e;
    font-family:"Trebuchet MS",system-ui,sans-serif;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{display:block;touch-action:none}
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(10,5,20,.55))}
  #hud{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
    padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
  #msg{background:#3a2f4acc;color:#ffe9d2;border-radius:20px;padding:10px 20px;
    font-size:17px;text-align:center;max-width:90vw}
  #out{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));
    display:none;font:inherit;font-size:16px;padding:10px 20px;border:0;border-radius:16px;
    background:#ffb36b;color:#2b2033}
  #fsBtn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
    width:46px;height:46px;border:0;border-radius:50%;font-size:22px;line-height:46px;padding:0;
    background:#3a2f4acc;color:#ffe9d2;display:none;z-index:5}
  #start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;text-align:center;padding:24px;color:#ffe9d2;
    background:radial-gradient(ellipse at center,#4a3560 0%,#241c2e 70%)}
  #start h1{margin:0;font-size:clamp(30px,6vw,56px);font-weight:700;letter-spacing:.5px}
  #start p{margin:0;font-size:clamp(16px,2.4vw,22px);opacity:.85;max-width:30em}
  #go{font:inherit;font-size:22px;padding:14px 44px;border:0;border-radius:24px;background:#ffb36b;color:#2b2033;
    box-shadow:0 6px 0 #c98443}
  #go:active{transform:translateY(4px);box-shadow:0 2px 0 #c98443}
  #tip{font-size:14px;opacity:.6;max-width:26em}
</style>
</head>
<body>
<div id="vig"></div>
<div id="hud"><div id="msg"></div></div>
<button id="out">Sacar el disco</button>
<button id="fsBtn" aria-label="Pantalla completa">⛶</button>
<div id="start">
  <h1 id="t1">El vinilo roto</h1>
  <p id="t2">Ayúdame a repararlo, pieza por pieza.</p>
  <button id="go">Jugar</button>
  <div id="tip">Se abrirá en pantalla completa. Para salir, toca la ✕ de arriba a la derecha.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
/* ================= 1. DATOS (aquí cambias cosas) ================= */
const T=THREE;
/* ======== CONFIG: aquí personalizas TODO ======== */
const CONFIG={
  title:'El vinilo roto',                    // título de la pantalla de inicio
  subtitle:'Ayúdame a repararlo, pieza por pieza.',
  cover:'portada.jpg',                       // portada del álbum
  backCover:'contraportada.jpg',             // parte de atrás del álbum
  photo:'foto.jpg',                          // foto del cuadro de la mesa
  tracks:['tracks/1.mp3','tracks/2.mp3','tracks/3.mp3','tracks/4.mp3',
          'tracks/5.mp3','tracks/6.mp3','tracks/7.mp3'],   // trozo 1..7
  songs:["I Thought About Killing You","Yikes","All Mine","Wouldn't Leave",
         "No Mistakes","Ghost Town","Violent Crimes"],     // nombres que se muestran
  noteText:["Feliz cumple mi vida","estoy muy orgulloso de ti,","te amo más que kanye loves kanye,",
            "eres el amor de mi vida,","prometo que nunca","dejará de sonar ghost town"],
  noteTrack:5                                // canción al voltear la portada (0=primera, 5=Ghost Town)
};
document.getElementById('t1').textContent=CONFIG.title;
document.getElementById('t2').textContent=CONFIG.subtitle;
const SONGS=CONFIG.songs;

const TINT=['#8ecae6','#ffb5a7','#b8e0a8','#ffd97d','#c9b6e4','#f7a8c4','#9fd8cb'];
const N=7, R=2.05, H=.14, BEV=.015, HH=(H+2*BEV)/2, STEP=Math.PI/4;
const DISC=new T.Vector3(0,0,.4);            // dónde se arma el disco
const TT=new T.Vector3(5.8,0,-3.2);          // tocadiscos
const PLAT=new T.Vector3(5.3,1.14,-3.2);     // plato del tocadiscos
const CS=4.4, CT=.12;                        // tamaño y grosor de la portada
const NOTE_TEXT=CONFIG.noteText;
let phase='puzzle',placed=0,glued=0,polish=0,playing=false,playIdx=-1,disc=null,drag=null,noteOn=false,zoom=false;
const hex=c=>parseInt(c.slice(1),16), cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrapPi=a=>((a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
const msg=document.getElementById('msg'), say=t=>{if(msg.textContent!==t)msg.textContent=t;};

/* ================= 2. ESCENA, CÁMARA, LUCES ================= */
const scene=new T.Scene();
scene.background=new T.Color(0x241c2e);
scene.fog=new T.Fog(0x241c2e,26,55);
const cam=new T.PerspectiveCamera(45,1,.5,200);
let pr=Math.min(devicePixelRatio,2);                         // resolución (baja sola si hay lag)
const renderer=new T.WebGLRenderer({antialias:devicePixelRatio<2,powerPreference:'high-performance'});
renderer.setPixelRatio(pr);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFShadowMap;
renderer.shadowMap.autoUpdate=false;                         // las sombras se actualizan en el loop
renderer.toneMapping=T.ACESFilmicToneMapping; renderer.toneMappingExposure=.95;
document.body.appendChild(renderer.domElement);

const camHome=new T.Vector3(), lookHome=new T.Vector3(0,.8,-.5), lookNow=lookHome.clone(), _g=new T.Vector3(), _l=new T.Vector3();
let zoomK=1;
// la cámara solo encuadra lo esencial: tapete, cuadro, tocadiscos
const fitPts=[[-7.3,0,5.2],[7.3,0,5.2],[7.7,0,5.4],[7.5,2.5,4.4],[-7.3,0,-4.2]]
  .map(p=>new T.Vector3(p[0],p[1],p[2]));
const topPt=new T.Vector3(1.5,4.8,-8.3);        // borde de arriba de la ventana
const camDir=new T.Vector3(0,9.5,11.5), _p=new T.Vector3();
function resize(){
  const w=innerWidth,h=innerHeight,a=w/h;
  renderer.setSize(w,h); cam.aspect=a; cam.updateProjectionMatrix();
  zoomK=Math.max(1,1.1/a);
  lookHome.set(0,.8,-.5);
  for(let s=.8;s<4.5;s+=.04){                   // 1) aleja hasta que entren los lados y el tapete
    camHome.copy(camDir).multiplyScalar(s);
    cam.position.copy(camHome); cam.lookAt(lookHome); cam.updateMatrixWorld(true);
    if(fitPts.every(p=>{_p.copy(p).project(cam);return Math.abs(_p.x)<.97&&_p.y<.97&&_p.y>-.88;})) break;
  }
  for(let i=0;i<40;i++){                        // 2) sube la imagen hasta que la ventana toque el borde de arriba
    cam.lookAt(lookHome); cam.updateMatrixWorld(true);
    if(_p.copy(topPt).project(cam).y>=.95) break;
    lookHome.y-=.3;
  }
  lookNow.copy(lookHome);
  const d=camHome.length(); scene.fog.near=d+12; scene.fog.far=d+40;
}
addEventListener('resize',resize); resize();
cam.position.copy(camHome);

scene.add(new T.HemisphereLight(0x9fb0ff,0x5a3d2b,.4));
const sun=new T.DirectionalLight(0xffd9a8,.7);
sun.position.set(-5,14,7); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); sun.shadow.bias=-.0005;
Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12});
scene.add(sun);
const lampLight=new T.PointLight(0xffb36b,.9,26,1.5); lampLight.position.set(-8,3.2,-6); scene.add(lampLight);
const gloss=new T.PointLight(0xffffff,.4,40,2); gloss.position.set(-4,8,6); scene.add(gloss);   // reflejo en la portada

/* ================= 3. AYUDANTES ================= */
// mm = material normal (ligero) · mp = material con barniz brillante (solo la portada)
const mm=(c,r=.6,o={})=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:r},o));
const mp=(c,r=.3,o={})=>new T.MeshPhysicalMaterial(Object.assign({color:c,roughness:r,clearcoat:1,clearcoatRoughness:.12},o));
function add(geo,mat,x,y,z,cast=true,parent=scene){
  const m=new T.Mesh(geo,mat); m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=true; parent.add(m); return m;
}
function shadows(g){g.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;}});return g;}
function cv(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return c;}
function tex(c,rep){const t=new T.CanvasTexture(c);if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}t.anisotropy=2;return t;}
const MAXANI=renderer.capabilities.getMaxAnisotropy();       // fotos nítidas aunque estén inclinadas
function sharp(t){t.anisotropy=MAXANI;t.minFilter=T.LinearMipmapLinearFilter;t.magFilter=T.LinearFilter;return t;}
// caja redondeada (en vez de cubos duros)
function rbox(w,h,d,r=.15,bev=.05){
  const s=new T.Shape(),x=-w/2,y=-d/2;
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+d-r);
  s.quadraticCurveTo(x+w,y+d,x+w-r,y+d);s.lineTo(x+r,y+d);s.quadraticCurveTo(x,y+d,x,y+d-r);
  s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
  const g=new T.ExtrudeGeometry(s,{depth:h-2*bev,bevelEnabled:true,bevelThickness:bev,bevelSize:bev,bevelSegments:3,curveSegments:6});
  g.rotateX(-Math.PI/2); g.computeBoundingBox();
  const c=new T.Vector3(); g.boundingBox.getCenter(c); g.translate(-c.x,-c.y,-c.z); return g;
}
let ac; function blip(f=520,d=.12){try{
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain(); o.type='triangle'; o.frequency.value=f;
  g.gain.setValueAtTime(.12,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+d);}catch(e){}}

/* ================= 4. FÍSICA (cannon.js) ================= */
const world=new CANNON.World(); world.gravity.set(0,-25,0); world.solver.iterations=5;
const pm=new CANNON.Material('pm');
world.addContactMaterial(new CANNON.ContactMaterial(pm,pm,{friction:.35,restitution:.12}));
function staticBox(hx,hy,hz,x,y,z){
  const b=new CANNON.Body({mass:0,material:pm}); b.addShape(new CANNON.Box(new CANNON.Vec3(hx,hy,hz)));
  b.position.set(x,y,z); b.collisionFilterGroup=1; b.collisionFilterMask=-1; world.addBody(b); return b;
}
const ground=new CANNON.Body({mass:0,material:pm}); ground.addShape(new CANNON.Plane());
ground.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0),-Math.PI/2);
ground.collisionFilterGroup=1; ground.collisionFilterMask=-1; world.addBody(ground);
staticBox(.5,6,9,11,0,0); staticBox(.5,6,9,-11,0,0); staticBox(11,6,.5,0,0,-8); staticBox(11,6,.5,0,0,8);
staticBox(2.9,.45,2.6,TT.x,.45,TT.z);                       // base del tocadiscos
function mkBody(hx,hy,hz,x,y,z,grp,mask){
  const b=new CANNON.Body({mass:1,material:pm,linearDamping:.6});
  b.addShape(new CANNON.Box(new CANNON.Vec3(hx,hy,hz))); b.position.set(x,y,z);
  b.fixedRotation=true; b.updateMassProperties();
  b.collisionFilterGroup=grp; b.collisionFilterMask=mask; world.addBody(b); return b;
}
const props=[];
function makeProp(mesh,kind,hx,hy,hz,x,y,z){
  const b=mkBody(hx,hy,hz,x,y,z,2,-1);      // todos chocan con todo
  const p={mesh,kind,body:b,active:true,yaw:0,yawT:0,flip:0,flipT:0,parked:null};
  mesh.userData.prop=p; props.push(p); return p;
}

/* ================= 5. TEXTURAS ================= */
const woodT=tex(cv(512,512,(x,w,h)=>{
  const cols=['#8a5a3b','#7d5035','#946243','#85563a'];
  for(let i=0;i<4;i++){
    x.fillStyle=cols[i]; x.fillRect(0,i*128,w,128);
    for(let k=0;k<40;k++){
      x.strokeStyle=`rgba(60,30,15,${.05+Math.random()*.12})`; x.lineWidth=1+Math.random()*2;
      const y=i*128+Math.random()*128; x.beginPath(); x.moveTo(0,y);
      x.bezierCurveTo(150,y+Math.random()*8-4,350,y+Math.random()*8-4,w,y); x.stroke();
    }
    x.fillStyle='rgba(40,20,10,.6)'; x.fillRect(0,i*128,w,3);
  }}),[3,2]);
const matT=tex(cv(512,340,(x,w,h)=>{
  x.fillStyle='#3f7a6c'; x.fillRect(0,0,w,h);
  for(let i=0;i<6000;i++){x.fillStyle=`rgba(255,255,255,${Math.random()*.06})`;x.fillRect(Math.random()*w,Math.random()*h,2,2);}
  x.strokeStyle='#f1d9a8'; x.setLineDash([10,8]); x.lineWidth=3; x.strokeRect(14,14,w-28,h-28);}));
const ginT=tex(cv(128,128,x=>{
  x.fillStyle='#fff'; x.fillRect(0,0,128,128); x.fillStyle='rgba(242,120,160,.55)';
  for(let i=0;i<4;i++){x.fillRect(i*32,0,16,128);x.fillRect(0,i*32,128,16);}}),[1.2,1.2]);

function vinylTex(tint,dirty){      // surcos + etiqueta verde; "sucio" lleva polvo y rayones
  const S=dirty?384:512;
  const t=tex(cv(S,S,(x,W)=>{
    const k=W/(2*R);
    x.fillStyle=dirty?'#2a2830':'#101015'; x.fillRect(0,0,W,W);
    for(let r=.95;r<R-.04;r+=.045){
      x.strokeStyle=dirty?tint+'99':`rgba(255,255,255,${.04+Math.random()*.05})`;
      x.lineWidth=1; x.beginPath(); x.arc(W/2,W/2,r*k,0,7); x.stroke();
    }
    x.fillStyle='#9be564'; x.beginPath(); x.arc(W/2,W/2,.78*k,0,7); x.fill();
    x.strokeStyle='#6fb344'; x.lineWidth=3; x.beginPath(); x.arc(W/2,W/2,.6*k,0,7); x.stroke();
    x.fillStyle='#101015'; x.beginPath(); x.arc(W/2,W/2,.07*k,0,7); x.fill();
    if(dirty){
      for(let i=0;i<140;i++){x.fillStyle=`rgba(200,190,180,${Math.random()*.12})`;x.beginPath();x.arc(Math.random()*W,Math.random()*W,Math.random()*9,0,7);x.fill();}
      for(let i=0;i<30;i++){x.strokeStyle=`rgba(255,255,255,${.1+Math.random()*.25})`;x.lineWidth=1;x.beginPath();
        const a=Math.random()*W,b=Math.random()*W;x.moveTo(a,b);x.lineTo(a+Math.random()*90-45,b+Math.random()*90-45);x.stroke();}
    }}));
  t.repeat.set(1/(2*R),1/(2*R)); t.offset.set(.5,.5); return t;
}
const cleanTex=vinylTex('#000000',false);        // una sola textura limpia compartida por los 7 trozos

/* ================= 6. AMBIENTE ================= */
const table=add(new T.BoxGeometry(22,.6,16),mm(0xffffff,.8,{map:woodT}),0,-.3,0,false);
add(new T.BoxGeometry(14,.012,9),mm(0xffffff,.95,{map:matT}),0,.006,.4,false);   // tapete
add(new T.BoxGeometry(60,30,.5),mm(0x3a2d4d,.95),0,12,-8.8,false);               // pared
// ventana con luna
add(new T.BoxGeometry(5.4,3,.3),mm(0x5b4630),1.5,3.2,-8.45,false);
add(new T.PlaneGeometry(4.8,2.6),new T.MeshBasicMaterial({color:0x31457f}),1.5,3.2,-8.28,false);
add(new T.BoxGeometry(.12,2.6,.1),mm(0x5b4630),1.5,3.2,-8.25,false);
add(new T.BoxGeometry(4.8,.12,.1),mm(0x5b4630),1.5,3.2,-8.25,false);
add(new T.CircleGeometry(.35,24),new T.MeshBasicMaterial({color:0xfff2c6}),2.8,3.7,-8.26,false);
// lámpara
add(new T.CylinderGeometry(.6,.7,.2,24),mm(0x2b2033),-8,.1,-6);
add(new T.CylinderGeometry(.07,.07,3.2,12),mm(0x2b2033),-8,1.7,-6);
const shade=add(new T.ConeGeometry(1.2,1.1,24,1,true),mm(0xffd9a8,.5,{emissive:0xff9d4d,emissiveIntensity:.7,side:T.DoubleSide}),-8,3.5,-6);
// planta
add(new T.CylinderGeometry(.8,.6,1.2,20),mm(0xc9704f),8.4,.6,-6.4);
for(let k=0;k<8;k++){
  const a=k/8*Math.PI*2, leaf=add(new T.SphereGeometry(.5,12,8),mm(0x5fae6a,.7),8.4+Math.cos(a)*.45,1.9,-6.4+Math.sin(a)*.45);
  leaf.scale.set(.35,1,.12); leaf.rotation.set(Math.sin(a)*.6,0,-Math.cos(a)*.6);
}
// taza
add(new T.CylinderGeometry(.4,.35,.6,16),mm(0xf4f1ea,.5),-1,.3,-6.4);
add(new T.TorusGeometry(.2,.06,8,16),mm(0xf4f1ea,.5),-.6,.32,-6.4);
// polvo flotando en la luz
const dp=new Float32Array(90*3); for(let i=0;i<dp.length;i+=3){dp[i]=Math.random()*20-10;dp[i+1]=Math.random()*7+.5;dp[i+2]=Math.random()*14-8;}
const dg=new T.BufferGeometry(); dg.setAttribute('position',new T.BufferAttribute(dp,3));
const dust=new T.Points(dg,new T.PointsMaterial({color:0xffd9a8,size:.07,transparent:true,opacity:.55,depthWrite:false})); scene.add(dust);

// contorno discreto de dónde va el vinilo
const guide=new T.Mesh(new T.PlaneGeometry(2*R+.1,2*R+.1),new T.MeshBasicMaterial({
  map:tex(cv(512,512,(x,w)=>{x.strokeStyle=x.fillStyle='#f1d9a8';x.lineWidth=6;x.setLineDash([22,16]);
    x.beginPath();x.arc(w/2,w/2,w/2-8,0,7);x.stroke();x.setLineDash([]);x.beginPath();x.arc(w/2,w/2,9,0,7);x.fill();})),
  transparent:true,opacity:.55,depthWrite:false}));
guide.rotation.x=-Math.PI/2; guide.position.set(DISC.x,.02,DISC.z); scene.add(guide);

/* --- Cuadro con tu foto (decoración). Mueve FRAME para cambiarlo de sitio --- */
const FRAME=new T.Vector3(6.4,0,4.6), FW=2.7, FH=2.1, PW=FW*.7, PH=FH*.72;
const frameG=new T.Group(); frameG.position.set(FRAME.x,0,FRAME.z); frameG.rotation.y=-.35; scene.add(frameG);
const lean=new T.Group(); lean.rotation.x=-.12; frameG.add(lean);        // inclinado hacia atrás
const woodM=mm(0x6b4429,.55);
add(rbox(FW,.22,FH,.25),woodM,0,FH/2+.05,0,true,lean).rotation.x=Math.PI/2;
add(new T.PlaneGeometry(FW*.84,FH*.86),mm(0xfff6ea,.9),0,FH/2+.05,.116,false,lean);   // paspartú
const photoMat=new T.MeshBasicMaterial({color:0xe6e6e6,map:tex(cv(256,256,(x,w,h)=>{   // foto de respaldo
  x.fillStyle='#f7c6d6';x.fillRect(0,0,w,h);x.fillStyle='#e0527a';x.font='120px sans-serif';
  x.textAlign='center';x.fillText('♥',w/2,150);x.font='24px sans-serif';x.fillText('Pon tu foto aquí',w/2,205);}))});
add(new T.PlaneGeometry(PW,PH),photoMat,0,FH/2+.05,.122,false,lean);
add(new T.BoxGeometry(.14,FH*.7,.08),woodM,0,FH*.35,-.4,true,frameG).rotation.x=-.35;  // pata, detrás del cuadro
new T.TextureLoader().load(CONFIG.photo,t=>{                  // recorta tu foto para que llene el cuadro
  sharp(t);
  const fa=PW/PH, ia=t.image.width/t.image.height;
  if(ia>fa){t.repeat.x=fa/ia;t.offset.x=(1-t.repeat.x)/2;} else {t.repeat.y=ia/fa;t.offset.y=(1-t.repeat.y)/2;}
  photoMat.map=t;photoMat.needsUpdate=true;},undefined,()=>console.warn('Falta '+CONFIG.photo));
/* --- Cuerpos sólidos de la decoración (nada los atraviesa) --- */
staticBox(1.25,FH/2,.8,FRAME.x,FH/2,FRAME.z);   // cuadro
staticBox(.7,.5,.7,-8,.5,-6);                   // base de la lámpara
staticBox(.85,1.2,.85,8.4,1.2,-6.4);            // planta
staticBox(.45,.3,.45,-1,.3,-6.4);               // taza

/* ================= 7. TOCADISCOS ================= */
const tt=new T.Group(); tt.position.copy(TT); scene.add(tt);
add(rbox(5.8,.9,5.2,.35),mm(0x8a5a3b,.6),0,.45,0,true,tt);
add(new T.CylinderGeometry(2.4,2.4,.12,48),mm(0x3a3844,.4,{metalness:.3}),-.5,.96,0,true,tt);
add(new T.CylinderGeometry(2.3,2.3,.03,48),mm(0x15141a,.9),-.5,1.03,0,false,tt);

function noteTex(){                                  // el texto se acomoda solo en el papel
  return tex(cv(1024,1024,(x,w,h)=>{
    x.fillStyle='#fff3a8'; x.fillRect(0,0,w,h);

    const family='"Segoe Print","Bradley Hand","Comic Sans MS",cursive';
    const words=NOTE_TEXT.join(' ').split(/\s+/);
    let size=100, lines;
    for(;size>=28;size-=2){
      x.font=`${size}px ${family}`; lines=[]; let cur='';
      for(const wd of words){
        const t=cur?cur+' '+wd:wd;
        if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=wd;} else cur=t;
      }
      lines.push(cur);
      if(lines.length*size*1.3<=maxH) break;
    }
    x.fillStyle='#4a3a6a'; x.textAlign='center'; x.textBaseline='top';
    let y=pad+(maxH-lines.length*size*1.3)/2+20;
    lines.forEach(l=>{x.fillText(l,w/2,y);y+=size*1.3;});
    x.font='90px sans-serif'; x.fillStyle='#e0527a'; x.textBaseline='alphabetic'; x.fillText('♥',w/2,h-pad);

/* ================= 10. LOS 7 TROZOS ROTOS ================= */
const slice=2*Math.PI/N, ang=[];
for(let i=0;i<N;i++) ang.push(i*slice+(Math.random()-.5)*.35);
ang.push(ang[0]+2*Math.PI);
function crack(a){                                // línea quebrada del centro al borde
  const pts=[],S=6;
  for(let j=0;j<=S;j++){
    const r=R*j/S, d=(j===0||j===S)?0:(Math.random()-.5)*.55*Math.min(1,r/1.2);
    pts.push([r*Math.sin(a)+d*Math.cos(a), r*Math.cos(a)-d*Math.sin(a)]);
  }
  return pts;
}
const edges=ang.slice(0,N).map(crack); edges.push(edges[0]);     // el borde i+1 es compartido: los trozos encajan
const shards=[];
for(let i=0;i<N;i++){
  const sh=new T.Shape(); sh.moveTo(0,0);
  edges[i].slice(1).forEach(p=>sh.lineTo(p[0],p[1]));
  for(let k=1;k<=8;k++){const a=ang[i]+(ang[i+1]-ang[i])*k/8; sh.lineTo(R*Math.sin(a),R*Math.cos(a));}
  edges[i+1].slice(1,-1).reverse().forEach(p=>sh.lineTo(p[0],p[1]));
  const g=new T.ExtrudeGeometry(sh,{depth:H,bevelEnabled:true,bevelThickness:BEV,bevelSize:BEV,bevelSegments:2,curveSegments:4});
  g.rotateX(-Math.PI/2); g.computeBoundingBox();
  const bc=new T.Vector3(),sz=new T.Vector3(); g.boundingBox.getCenter(bc); g.boundingBox.getSize(sz);
  g.translate(-bc.x,-bc.y,-bc.z);
  const dirty=vinylTex(TINT[i],true), clean=cleanTex;
  const faceMat=mm(0xffffff,.8,{map:dirty,metalness:.05});
  const mesh=new T.Mesh(g,[faceMat,mm(0x17161c,.5)]); mesh.castShadow=mesh.receiveShadow=true; mesh.userData.i=i;
  const a=(10+i*26.7)*Math.PI/180;                                // en arco frente al tapete
  const px=Math.cos(a)*4.5+(Math.random()-.5), pz=DISC.z+Math.sin(a)*3.6+(Math.random()-.5)*.6;
  const p=makeProp(mesh,'shard',sz.x*.42,HH,sz.z*.42,px,2+i*.7,pz);
  p.yaw=p.yawT=(1+Math.floor(Math.random()*7))*STEP;
  const s={mesh,prop:p,faceMat,dirty,clean,c:{x:bc.x,z:bc.z},target:new T.Vector3(DISC.x+bc.x,HH,DISC.z+bc.z),snapped:false,glued:false,inDisc:false};
  p.shard=s; shards.push(s); scene.add(mesh);
}

const ray=new T.Raycaster(), ndc=new T.Vector2(), plane=new T.Plane(new T.Vector3(0,1,0),0), hit=new T.Vector3();
function setRay(e){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,cam);}
const isBack=p=>Math.round(p.flipT/Math.PI)%2!==0;
const outBtn=document.getElementById('out');
function setZoom(v){zoom=v;say(v?'Toca en cualquier parte para volver ♥':'Puedes seguir moviendo la portada.');}

renderer.domElement.addEventListener('pointerdown',e=>{
  if(zoom){setZoom(false);return;}
  if(drag){ if(e.pointerId!==drag.pid){drag.p.yawT+=STEP;blip(300,.05);} return; }   // 2.º dedo = girar
  setRay(e);
  const h=ray.intersectObjects(props.filter(p=>p.active).map(p=>p.mesh),true)[0]; if(!h) return;
  let o=h.object; while(o&&!(o.userData.prop&&o.userData.prop.active)) o=o.parent;
  if(!o) return;
  const p=o.userData.prop;
  ray.ray.intersectPlane(plane,hit);
  drag={p,pid:e.pointerId,moved:false,sx:e.clientX,sy:e.clientY,hitObj:h.object,
        ox:p.body.position.x-hit.x,oz:p.body.position.z-hit.z,tx:p.body.position.x,tz:p.body.position.z};
});
addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid) return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8){
    drag.moved=true; const p=drag.p;
    if(p===glue){p.flipT=2.7;blip(420,.06);}                  // el pegamento se voltea al sujetarlo
    if(p.parked){                                             // sacar el disco del tocadiscos
      p.parked=null; p.yaw=p.yawT=p.mesh.rotation.y;
      p.body.position.set(p.mesh.position.x,p.mesh.position.y,p.mesh.position.z);
      p.body.velocity.set(0,0,0); world.addBody(p.body); stopPlay();
    }
  }
  if(drag.moved){
    setRay(e); ray.ray.intersectPlane(plane,hit);
    drag.tx=cl(hit.x+drag.ox,-9.5,9.5); drag.tz=cl(hit.z+drag.oz,-6.5,6.5);
  }
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.pid) return;
  const d=drag; drag=null;
  d.moved?release(d.p):tap(d.p,d.hitObj);
}
addEventListener('pointerup',endDrag); addEventListener('pointercancel',endDrag);

function tap(p,obj){
  if(p.kind==='shard'){p.yawT+=STEP;blip(380,.05);}
  else if(p.kind==='disc'){
    if(p.parked==='tt'&&obj.userData.i!==undefined) play(obj.userData.i);
    else say('Arrastra el disco al tocadiscos o a su portada.');
  }
  else if(p===cover&&noteOn){setZoom(true);}
  else if(p===glue){say('Mantén el pegamento y arrástralo sobre las grietas.');}
  else {p.flipT+=Math.PI;p.body.velocity.y=6;blip(300,.08);}                    // ¡voltear!
}
function release(p){
  if(p===glue) p.flipT=0;
  const b=p.body;
  if(p.kind==='shard'){
    const s=p.shard;
    if(Math.hypot(b.position.x-s.target.x,b.position.z-s.target.z)<.9&&Math.round(p.yawT/STEP)%8===0) snap(p);
  } else if(p.kind==='disc'){
    if(Math.hypot(b.position.x-PLAT.x,b.position.z-PLAT.z)<2.6) parkDisc();
    else if(!isBack(cover)&&Math.hypot(b.position.x-cover.body.position.x,b.position.z-cover.body.position.z)<2.8) sleeveDisc();
  }
}
function snap(p){
  const s=p.shard,b=p.body; p.active=false; s.snapped=true; placed++;
  b.mass=0; b.type=CANNON.Body.STATIC; b.updateMassProperties();          // queda fijo y sólido
  b.velocity.set(0,0,0); b.position.set(s.target.x,s.target.y,s.target.z); b.quaternion.set(0,0,0,1);
  blip(500+placed*60,.15);
  if(placed===N){phase='glue';say('¡Todo en su sitio! Arrastra el pegamento sobre las grietas.');}
  else say(`Encaja (${placed}/${N})`);
}
function finish(){
  phase='play'; blip(880,.3); guide.visible=false;
  const grp=new T.Group(); grp.position.set(DISC.x,HH,DISC.z); scene.add(grp);
  shards.forEach(s=>{
    s.prop.active=false; s.inDisc=true; grp.add(s.mesh);
    s.mesh.position.set(s.c.x,0,s.c.z); s.mesh.rotation.set(0,0,0); s.mesh.scale.set(1,1,1);
    s.faceMat.map=s.clean; s.faceMat.roughness=.22; s.faceMat.metalness=.15; s.faceMat.needsUpdate=true;
  });
  shards.forEach(s=>world.removeBody(s.prop.body));
  disc=makeProp(grp,'disc',R*.78,HH,R*.85,DISC.x,HH,DISC.z);
  say('¡Vinilo reparado! Arrástralo al tocadiscos o a su portada.');
}
function parkDisc(){
  world.removeBody(disc.body); disc.parked='tt'; disc.parkPos=PLAT.clone();
  disc.mesh.rotation.set(0,disc.yaw,0); blip(560,.2); say('Toca un trozo del disco para escuchar su canción.');
}
function sleeveDisc(){
  world.removeBody(disc.body); disc.active=false; disc.parked=null; cover.sleeved=true; stopPlay();
  coverG.add(disc.mesh); disc.mesh.position.set(1,0,0); disc.mesh.rotation.set(0,0,0); disc.mesh.scale.set(1,.5,1);
  outBtn.style.display='block';
  blip(520,.2); say('Guardado en su portada. Levántala y dale la vuelta (tócala) ♥');
}
outBtn.onclick=()=>{
  if(!cover.sleeved) return;
  cover.sleeved=false; outBtn.style.display='none';
  cover.flipT=Math.round(cover.flipT/(2*Math.PI))*2*Math.PI;          // la portada vuelve boca arriba
  disc.mesh.scale.set(1,1,1); disc.mesh.rotation.set(0,0,0); scene.add(disc.mesh);
  disc.yaw=disc.yawT=0; disc.flip=disc.flipT=0;
  const cb=cover.body;
  disc.body.position.set(cb.position.x+.8,cb.position.y+1.5,cb.position.z);
  disc.body.velocity.set(0,0,0); disc.body.quaternion.set(0,0,0,1);
  world.addBody(disc.body); disc.active=true;
  say('Disco fuera. Arrástralo al tocadiscos o guárdalo otra vez.');
};

/* ================= 12. AUDIO (se descarga todo al abrir) ================= */
const audio=new Audio(); audio.preload='auto';
const urls=[];                                           // una dirección lista por canción
function loadTrack(i,tries=0){
  fetch(CONFIG.tracks[i]).then(r=>{if(!r.ok)throw 0;return r.blob();})
    .then(b=>{urls[i]=URL.createObjectURL(b); if(playIdx===i&&!playing) play(i);})   // si la tocaste mientras cargaba, suena sola
    .catch(()=>{ if(tries<4) setTimeout(()=>loadTrack(i,tries+1),1500*(tries+1)); else urls[i]=CONFIG.tracks[i]; });
}
CONFIG.tracks.forEach((_,i)=>loadTrack(i));

function highlight(i){shards.forEach((s,j)=>{s.faceMat.emissive.setHex(j===i?hex(TINT[j]):0);s.faceMat.emissiveIntensity=.55;});}
const hint=()=>noteOn?' · Toca la nota para verla de cerca':'';
function play(i){
  playIdx=i; highlight(i);
  if(!urls[i]){say(`Cargando "${SONGS[i]}"…`+hint());return;}   // arranca sola cuando termine de cargar
  if(audio.dataset.i!==String(i)){audio.src=urls[i];audio.dataset.i=String(i);} else audio.currentTime=0;
  audio.play().then(()=>{playing=true;say(`▶ ${i+1}. ${SONGS[i]}`+hint());})
    .catch(err=>{
      if(err.name==='AbortError') return;                         // se interrumpió a propósito: no es un error
      say(err.name==='NotAllowedError'?'Toca de nuevo para activar el sonido':`No se pudo reproducir ${CONFIG.tracks[i]}`);
    });
}
function stopPlay(){audio.pause();playing=false;playIdx=-1;highlight(-1);}
audio.addEventListener('ended',()=>{                      // pasa sola a la siguiente canción
  if(disc&&disc.parked==='tt'&&playIdx>=0&&playIdx<N-1) play(playIdx+1); else stopPlay();
});

const startEl=document.getElementById('start'), fsBtn=document.getElementById('fsBtn');
const root=document.documentElement;
const reqFS=root.requestFullscreen||root.webkitRequestFullscreen;
const exitFS=document.exitFullscreen||document.webkitExitFullscreen;
const inFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function unlockAudio(){                                   // el primer toque "desbloquea" el sonido en la tablet
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();}catch(e){}
  audio.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
  audio.dataset.i='';
  audio.play().then(()=>audio.pause()).catch(()=>{});
}
function enterFS(){ if(reqFS){try{const r=reqFS.call(root);if(r&&r.catch)r.catch(()=>{});}catch(e){}} }
function updateFsBtn(){
  if(!reqFS){fsBtn.style.display='none';return;}           // iPhone: no existe pantalla completa (ver nota)
  fsBtn.style.display='block';
  fsBtn.textContent=inFS()?'✕':'⛶';
  fsBtn.setAttribute('aria-label',inFS()?'Salir de pantalla completa':'Pantalla completa');
}
document.getElementById('go').onclick=()=>{ unlockAudio(); startEl.style.display='none'; enterFS(); updateFsBtn(); };
fsBtn.onclick=()=>{ if(inFS()){ if(exitFS)exitFS.call(document); } else enterFS(); };
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{

}));

/* ================= 14. LOOP (optimizado) ================= */
let last=performance.now(), lastR=0, frame=0, fAcc=0, fN=0;
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  if(now-lastR<12) return; lastR=now;                  // máximo ~60 fps (pantallas de 120 Hz)
  const dt=Math.min((now-last)/1000,.05); last=now;
  frame++;
  renderer.shadowMap.needsUpdate=(frame%2===0);        // sombras cada 2 cuadros
  if(frame>90){                                        // resolución adaptativa: baja solo si va realmente mal
    fAcc+=dt; fN++;
    if(fN>=45){
      const avg=fAcc/fN; fAcc=0; fN=0;
      if(avg>.034&&pr>1){pr=Math.max(1,pr-.25);renderer.setPixelRatio(pr);renderer.setSize(innerWidth,innerHeight);}
    }
  }

  // el dedo "tira" del objeto sostenido
  if(drag&&drag.moved){
    const b=drag.p.body;
    b.velocity.set((drag.tx-b.position.x)*14,(1.4-b.position.y)*12,(drag.tz-b.position.z)*14);
    // pegar: pegamento sobre trozos colocados
    if(drag.p===glue&&phase==='glue'){
      shards.forEach(s=>{
        if(s.snapped&&!s.glued&&Math.hypot(b.position.x-s.mesh.position.x,b.position.z-s.mesh.position.z)<1.2){
          s.glued=true; glued++; blip(660,.1); say(`Pegado ${glued}/${N}`);
          if(glued===N){phase='polish';say('Ahora frota el disco con el paño rosa.');}
        }});
    }
    // pulir: mover el paño sobre el disco
    if(drag.p===cloth&&phase==='polish'&&Math.hypot(b.position.x-DISC.x,b.position.z-DISC.z)<2.4){
      polish+=Math.hypot(b.velocity.x,b.velocity.z)*dt; say(`Puliendo… ${Math.min(99,Math.floor(polish/10*100))}%`);
      if(polish>10) finish();
    }
  }
  world.step(1/60,dt,2);

  // sincronizar físicas -> gráficos
  for(const p of props){
    if(!p.active) continue;
    if(p.parked){ p.mesh.position.lerp(p.parkPos,.12); if(playing) p.mesh.rotation.y-=.02; continue; }
    const b=p.body;
    p.yaw+=wrapPi(p.yawT-p.yaw)*.25; p.flip+=(p.flipT-p.flip)*.2;
    p.mesh.position.set(b.position.x,b.position.y,b.position.z);
    p.mesh.rotation.set(p.flip,p.yaw,0,'YXZ');
    const q=p.mesh.quaternion; b.quaternion.set(q.x,q.y,q.z,q.w);
  }
  // trozos ya colocados
  for(const s of shards){
    if(!s.snapped||s.inDisc) continue;
    s.mesh.position.lerp(s.target,.25);
    s.mesh.rotation.y+=(s.prop.yawT-s.mesh.rotation.y)*.25;
    const sc=s.glued?1:.975; s.mesh.scale.x+=(sc-s.mesh.scale.x)*.2; s.mesh.scale.z=s.mesh.scale.x;
  }
  // brazo del tocadiscos
  const armT=(playing&&disc&&disc.parked==='tt')?-.57:0; arm.rotation.y+=(armT-arm.rotation.y)*.05;
  // nota atrás de la portada
  const back=isBack(cover);
  if(cover.sleeved&&back&&!noteOn){noteOn=true;play(CONFIG.noteTrack);blip(700,.2);}
  if(noteOn&&(!back||!cover.sleeved)){noteOn=false;stopPlay();}
  const ns=Math.max(.001,noteG.scale.x+((noteOn?1:.001)-noteG.scale.x)*.12);
  noteG.scale.setScalar(ns); noteG.visible=ns>.02;
  dust.rotation.y+=.0004;
  // cámara (y zoom a la nota)
  if(zoom&&!noteOn) zoom=false;
  const cp=cover.mesh.position;
  const goal=zoom?_g.set(cp.x,cp.y+5.2*zoomK,cp.z+2.2*zoomK):camHome;
  const look=zoom?_l.set(cp.x,cp.y,cp.z):lookHome;
  cam.position.lerp(goal,.08); lookNow.lerp(look,.08); cam.lookAt(lookNow);
  renderer.render(scene,cam);
}
loop();
</script>
